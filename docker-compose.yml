services:
  backend:
    build: ./backend
    image: mcp-voice-backend:latest
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: mcp-voice-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BACKEND_INTERNAL_URL=http://backend:8000
    restart: unless-stopped
