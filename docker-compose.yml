services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mcp-voice-backend:latest
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
    volumes:
      # Persist vector store across container restarts
      - backend_vectorstore:/app/.chromadb
    networks:
      - mcpnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_INTERNAL_URL=http://backend:8000
        - GEMINI_API_KEY=${GEMINI_API_KEY}
        - OPENAI_API_KEY=${OPENAI_API_KEY}
    image: mcp-voice-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - mcpnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend_vectorstore:
    driver: local

networks:
  mcpnet:
    driver: bridge