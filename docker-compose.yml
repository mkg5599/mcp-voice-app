services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mcp-voice-backend:latest
    ports:
      - "8000:8000"
    networks:
      - mcpnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mcp-voice-frontend:latest
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - mcpnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  mcpnet:
    driver: bridge