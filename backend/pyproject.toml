[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Product catalog MCP server (FastAPI + official MCP SDK + Gemini embeddings)"
authors = ["mkg5599 <gummadm@oregonstate.edu>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = "0.165.0"
uvicorn = {version = "0.35.0", extras = ["standard"]}
mcp = "2.3.0"
httpx = "0.28.1"
python-dotenv = ">=1.0.1,<2.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.0"
mypy = "^2.4.0"
pytest = "^8.3.2"
anyio = "^4.0.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "."

[tool.ruff]
line-length = 120
extend-exclude = [".venv"]

[tool.mypy]
exclude = ["\\.venv"]
ignore_missing_imports = true
