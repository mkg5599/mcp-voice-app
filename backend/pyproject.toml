[tool.poetry]
name = "backend"
version = "0.1.0"
description = "MCP product backend (FastAPI + Whisper transcription)"
authors = ["mkg5599 <gummadm@oregonstate.edu>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = "0.116.1"
uvicorn = {version = "0.35.0", extras = ["standard"]}
python-multipart = "0.0.20"
openai = ">=1.25.0,<2.0.0"
python-dotenv = ">=1.0.1,<2.0.0"
PyYAML = "^6.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.5"
mypy = "^1.11.0"
types-PyYAML = "^6.0.0"
pytest = "^8.3.2"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "."