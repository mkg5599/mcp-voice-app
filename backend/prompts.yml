mcp_discovery:
  name: "product-tools"
  version: "1.0"
  description: "Product catalog tools (list & filtered search)."
  tools:
    - name: "list_products"
      description: "List all products."
      input_schema: { "type": "object", "properties": {} }
    - name: "search_products"
      description: "Search products by colors, city and price range."
      input_schema:
        type: "object"
        properties:
          colors: { "type": "array", "items": { "type": "string" } }
          city: { "type": "string" }
          min_price: { "type": "number" }
          max_price: { "type": "number" }
    - name: "semantic_product_search"
      description: "Semantic search for products using natural language queries."
      input_schema:
        type: "object"
        properties:
          query: { "type": "string" }
          top_k: { "type": "number" }
