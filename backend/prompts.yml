
mcp_discovery:
  name: "product-tools"
  version: "2024-07-1"
  description: "Product catalog tools (list & filtered search)."
  tools:
    - name: "list_products"
      description: "List all products."
      input_schema: { "type": "object", "properties": {} }
    - name: "search_products"
      description: "Search products by colors, city and price range."
      input_schema:
        type: "object"
        properties:
          colors: { "type": "array", "items": { "type": "string" } }
          city: { "type": "string" }
          min_price: { "type": "number" }
          max_price: { "type": "number" }

transcribe:
  model: "whisper-1"
  response_format: "text"
  language: "en"
